name: Build and Deploy

on:
  push:
    branches: ["main"]

jobs:
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/predictgodai:latest

  deploy:
    needs: docker-image
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Créer le dossier s'il n'existe pas
            mkdir -p /home/${{ secrets.SERVER_USER }}/predictgodai/data

            # Tirer la nouvelle image
            docker pull ${{ secrets.DOCKER_USERNAME }}/predictgodai:latest
            
            # Stopper et supprimer l'ancien conteneur
            docker stop predictgodai || true
            docker rm predictgodai || true
            
            # Lancer le nouveau conteneur en liant le fichier .env et le dossier data (base SQLite)
            docker run -d --name predictgodai \
              --restart unless-stopped \
              --env-file /home/${{ secrets.SERVER_USER }}/predictgodai/.env \
              -v /home/${{ secrets.SERVER_USER }}/predictgodai/data:/usr/src/app/data \
              ${{ secrets.DOCKER_USERNAME }}/predictgodai:latest
